name: Build sample edition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: kushluk generate --no-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: kushluk-sample-edition
          path: |
            output/*.md
            output/*.html
            archive/**
